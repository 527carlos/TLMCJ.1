services:
  - type: web
    name: consola-tlm
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render actúa como proxy: sin esto, el límite de intentos contaría todas las peticiones como una sola IP
      - key: TRUST_PROXY
        value: "true"
      # Firma de las sesiones: Render genera un valor aleatorio
      - key: SESSION_SECRET
        generateValue: true
      # Base de datos PostgreSQL de Neon (obligatoria: sin ella los datos se pierden al redesplegar)
      - key: DATABASE_URL
        sync: false
      # Administrador inicial (solo se usa cuando la base está vacía)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Correo SMTP para códigos de recuperación y contraseñas provisionales
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
