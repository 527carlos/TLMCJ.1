    <script>
      // Suppress harmless Vite HMR WebSocket connection failure in iFrame preview
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event.reason || '') + (event.reason && event.reason.stack ? ' ' + event.reason.stack : '');
        if (str.includes('WebSocket') || str.includes('@vite/client') || str.includes('createWebSocketModuleRunnerTransport')) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var str = String(event.message || '') + (event.filename || '') + (event.error && event.error.stack ? ' ' + event.error.stack : '');
        if (str.includes('WebSocket') || str.includes('@vite/client') || str.includes('createWebSocketModuleRunnerTransport')) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
