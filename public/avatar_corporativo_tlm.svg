<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160f38" />
      <stop offset="50%" stop-color="#271a82" />
      <stop offset="100%" stop-color="#4059aa" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa9d1c" />
      <stop offset="100%" stop-color="#e64519" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGrad)" stroke="#fa9d1c" stroke-width="4"/>
  <!-- Decorative Grid / Shield Accent -->
  <circle cx="80" cy="80" r="66" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- TLM 4-Quadrant Emblem -->
  <g transform="translate(48, 48) scale(1.6)" filter="url(#shadow)">
    <!-- Top-Left: Indigo Leaf -->
    <path d="M 2 20 C 2 10, 10 2, 20 2 L 20 20 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Top-Right: Coral Leaf -->
    <path d="M 20 2 C 30 2, 38 10, 38 20 L 20 20 Z" fill="url(#coralGrad)"/>
    <!-- Bottom-Left: Amber Leaf -->
    <path d="M 2 20 L 20 20 L 20 38 C 10 38, 2 30, 2 20 Z" fill="#fa9d1c"/>
    <!-- Bottom-Right: Lavender Leaf -->
    <path d="M 20 20 L 38 20 C 38 30, 30 38, 20 38 Z" fill="#777eec"/>
  </g>

  <!-- Corporate Monogram Badge Ribbon: JY -->
  <g transform="translate(80, 128)">
    <rect x="-24" y="-10" width="48" height="20" rx="10" fill="#1c1343" stroke="#fa9d1c" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1">JY</text>
  </g>
</svg>
